[project]
name = "soltura"
version = "0.11.0"
description = "Personal Spanish tutor that trains reading, writing, listening and speaking around one learner model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "es-core-news-md",
    "fastapi>=0.162.0",
    "fsrs==6.3.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "spacy>=3.8.18",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "polyfactory>=3.5.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: calls a live external service; skipped unless its credentials are set"]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
# uv.lock records the project's own version, and semantic-release does not know about
# it. `version` applies the new version to pyproject.toml, stages `assets`, and only
# then runs build_command, so `uv lock` reads the bumped version and the refreshed lock
# lands in the same release commit.
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
