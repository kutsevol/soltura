{% extends "base.html" %}

{% block title %}Читання · Soltura{% endblock %}
{% block heading %}Читання{% endblock %}

{% block content %}
  <article>
    <p class="note">Оберіть тему одним дотиком:</p>
    <div class="topics">
      {% for topic in topics %}
        <button type="button" class="outline secondary"
                hx-post="/reading/text" hx-target="#text" hx-indicator="#loading"
                hx-vals='{{ {"topic": topic.prompt} | tojson }}'>{{ topic.label }}</button>
      {% endfor %}
    </div>
    <form hx-post="/reading/text" hx-target="#text" hx-indicator="#loading">
      <label>
        Тема
        <input name="topic" placeholder="напр. en el mercado, alquilar un piso">
      </label>
      <label>
        …або вставте іспанський текст, щоб адаптувати його під ваш рівень
        <textarea name="source_text" rows="4"></textarea>
      </label>
      <button type="submit">Дати текст</button>
      <span id="loading" class="htmx-indicator" aria-busy="true">Готую текст…</span>
    </form>
  </article>

  <article id="text" aria-live="polite"></article>
  <article id="gloss" aria-live="polite"></article>
{% endblock %}
