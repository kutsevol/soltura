<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Soltura{% endblock %}</title>
  {# htmx leaves 4xx/5xx responses unswapped by default; the error partials must reach the page. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    :root { --text: #1f2328; --muted: #59636e; --accent: #b4500f; --surface: #ffffff; --highlight: #fff1e5; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e6edf3; --muted: #9198a1; --accent: #f0883e; --surface: #0d1117; --highlight: #3b2512; }
    }
    body { margin: 0; background: var(--surface); color: var(--text); font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 1rem; }
    .stack { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.25rem; color: var(--muted); font-size: 0.9rem; }
    input, textarea { font: inherit; padding: 0.5rem; }
    .word { all: unset; cursor: pointer; border-radius: 3px; }
    .word:hover, .word:focus-visible { background: var(--highlight); outline: 1px solid var(--accent); }
    #gloss { position: sticky; bottom: 0; background: var(--surface); padding: 0.5rem 0; }
    .note { color: var(--muted); font-size: 0.9rem; }
    .error { color: var(--accent); }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .sentence { font-size: 1.15rem; }
    .gap { letter-spacing: 0.1em; color: var(--accent); }
    mark { background: var(--highlight); color: inherit; padding: 0 0.15em; border-radius: 3px; }
    .verdict-good, .verdict-easy { color: #1a7f37; }
    .verdict-hard { color: #9a6700; }
    .verdict-again { color: var(--accent); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
