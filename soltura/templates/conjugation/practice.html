{% extends "base.html" %}

{% block title %}Своє дієслово · Soltura{% endblock %}
{% block heading %}Своє дієслово{% endblock %}

{% block content %}
  <article>
    <form hx-post="/conjugation/practice/start" hx-target="#practice">
      <label>
        Дієслово в інфінітиві
        <input name="verb" value="{{ verb }}" placeholder="напр. comer" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <fieldset>
        <legend>Часи</legend>
        {% for tense in tenses %}
          <label>
            <input type="checkbox" name="tense" value="{{ tense.value }}"{% if tense.checked %} checked{% endif %}>
            {{ tense.label }}
          </label>
        {% endfor %}
      </fieldset>
      <button type="submit">Почати</button>
    </form>
    <p class="note">Тут нічого не зберігається і не змінює розклад повторень: це вільна практика.</p>
  </article>
  <article id="practice" aria-live="polite"></article>
{% endblock %}
