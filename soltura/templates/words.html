{% extends "base.html" %}

{% block title %}Слова · Soltura{% endblock %}
{% block heading %}Слова{% endblock %}

{% block content %}
  <article>
    <form hx-post="/words/lookup" hx-target="#preview" hx-indicator="#lookup-loading">
      <label for="words-input">Додати слова: по одному в рядку, до 20</label>
      <textarea id="words-input" name="words" rows="3" placeholder="nieto&#10;suegra&#10;vecino" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button type="submit">Знайти</button>
      <span id="lookup-loading" class="htmx-indicator" aria-busy="true">Шукаю…</span>
    </form>
    <div id="preview" aria-live="polite"></div>
  </article>
  <input type="search" name="q" value="{{ search }}" placeholder="Знайти слово" aria-label="Знайти слово"
         hx-get="/words/search" hx-trigger="input changed delay:300ms, search" hx-target="#words">
  <div id="words" hx-get="/words/search" hx-trigger="wordsChanged from:body" hx-include="[name='q']">
    {% include "words/list.html" %}
  </div>
{% endblock %}
