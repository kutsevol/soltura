name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The session fixture starts Postgres in a container and applies every
      # migration with `alembic upgrade head`, so this also checks the chain.
      - name: Pytest
        run: make test
