name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: a branch is often force-pushed several times while answering review
    # comments, and each push would fire a fresh review that mostly restates the first one.
    # The automatic pass runs once; later rounds go through `@claude` in claude.yml.
    types: [opened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: |
            --allowedTools "Skill" "Bash(gh api *)" "Bash(gh pr *)" "Bash(gh issue *)" "Bash(gh search *)" "mcp__github_inline_comment__create_inline_comment"
