name: Release

# Every push to main (a squash-merged PR) is released right away: semantic-release
# reads the conventional commits since the last tag, bumps pyproject.toml and
# uv.lock, updates CHANGELOG.md, commits `chore(release): X.Y.Z`, tags vX.Y.Z and
# publishes the GitHub release. Its own push uses GITHUB_TOKEN, which does not
# trigger workflows, so the release commit does not start another release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # build_command is `uv lock`, so uv must be on PATH before semantic-release runs.
      - uses: astral-sh/setup-uv@v6

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release version
